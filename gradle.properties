org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# compileSdk 36 is newer than AGP 8.4.2 officially knows about. The build is
# clean and the APK is correct; the only consequence is a per-build warning.
# Remove this line once AGP is bumped to a version that lists 36 as supported.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
